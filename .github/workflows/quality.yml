name: Sakhi quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            Sakhi-Backend/package-lock.json
            Sakhi-Frontend/Sakhi_Project/package-lock.json
      - name: Backend dependencies
        run: npm ci
        working-directory: Sakhi-Backend
      - name: Backend regressions
        run: npm test
        working-directory: Sakhi-Backend
      - name: Frontend dependencies
        run: npm ci
        working-directory: Sakhi-Frontend/Sakhi_Project
      - name: Chat lint and frontend unit tests
        run: |
          npm run lint:chat
          npm test
        working-directory: Sakhi-Frontend/Sakhi_Project
      - name: Production build
        run: npm run build
        working-directory: Sakhi-Frontend/Sakhi_Project
      - name: Install test browser
        run: npx playwright install --with-deps chrome
        working-directory: Sakhi-Frontend/Sakhi_Project
      - name: Desktop and mobile browser regressions
        run: npm run test:e2e
        working-directory: Sakhi-Frontend/Sakhi_Project
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: Sakhi-Frontend/Sakhi_Project/test-results
          retention-days: 7
