# Prepared staging blueprint. Review the service name/plan before importing.
# A persistent disk is needed for private resumes; applying this creates paid resources.
services:
  - type: web
    name: sakhi-staging-api
    runtime: node
    plan: 0.5c-512mb
    rootDir: Sakhi-Backend
    buildCommand: npm ci --omit=dev
    startCommand: npm run check:release && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: 'off'
    disk:
      name: sakhi-uploads
      mountPath: /var/data/sakhi
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: UPLOAD_DIR
        value: /var/data/sakhi/uploads
      - key: TRUST_PROXY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_API_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FROM_EMAIL
        sync: false
